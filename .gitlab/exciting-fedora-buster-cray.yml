# Cray compiler build test. We are using a LUMI based compiler
# therefore we can only test the build phase. This is because 
# Cray compiler singularity generates specific code for LUMI hardware
# which fails in other processors.

build:fedora-buster-cray:
   image: gitdocker.physik.hu-berlin.de/sol/exciting:fedora-32-cray18
   stage: build
   tags:
     - docker
   services:
     - docker:dind  # Enables Docker-in-Docker
   variables:
     DOCKER_DRIVER: overlay2
   script:
     - sh /cray/cce-18.sh
     - mkdir build-cmake && cd build-cmake
     - FC=ftn CC=cc CXX=cc ../external/cmake-3.31.3-linux-x86_64/bin/cmake -DFFTW3_ROOT=$FFTDIR -DOTHERLINALG=ON -DLINALGLIB=$LINALGDIR ..
     - make -j 4 -l 4
     - make install
   artifacts:
     paths:
       - install/lib
       - install/bin/exciting_mpismp
       - src/version.inc
     expire_in: 1 hrs

# GNU MPI+OMP build and tests. This contains scaLAPACK and HDF5.

build:fedora-buster-gnu-mpismp-complete:
   image: gitdocker.physik.hu-berlin.de/sol/exciting:fedora-GCC14-hdf5-fftw-scalapack-mpich
   stage: build
   tags:
     - docker
   rules:
     - if: '$CI_COMMIT_MESSAGE =~ /\[tutorial\]/'
       when: never
     - when: on_success
   before_script:
     - source /etc/profile.d/modules.sh
     - module load mpi
   script:
     - mkdir build-cmake && cd build-cmake
     - ../external/cmake-3.31.3-linux-x86_64/bin/cmake -DOPENBLAS=ON -DHDF5=ON -DSCALAPACK_ROOT=/usr/lib64/mpich -DSCALAPACK=ON ..
     - make -j 4 -l 4
     - make install
   artifacts:
     paths:
       - install/lib
       - install/bin/exciting_mpismp
       - src/version.inc
     expire_in: 5 hrs

test-fedora-buster-gnu-mpismp-complete:
   image: gitdocker.physik.hu-berlin.de/sol/exciting:fedora-GCC14-hdf5-fftw-scalapack-mpich
   stage: test
   dependencies:
     - build:fedora-buster-gnu-mpismp-complete
     - python:regressionframework-python3
   tags:
     - docker
   timeout: 4h
   rules:
     - if: '$CI_COMMIT_MESSAGE =~ /\[tutorial\]/'
       when: never
     - when: on_success
   before_script:
     - source /etc/profile.d/modules.sh
     - module load mpi
     - pip3 install numpy termcolor pytest pyyaml h5py
   script:
     # Run exciting unit tests
     - export OMP_NUM_THREADS=2 && install/bin/exciting_mpismp -run-unit-tests -kill-on-failure
     # Install test framework parsers
     - pip3 install -e tools/exciting_tools
     # Enter test folder
     - cd test/
     # In this case, ONLY run tests with GROUPS tag: HDF5 FASTBSE NONE LIBXC SCALAPACK
     - python3 set_groups.py -file defaults_config.yml -groups HDF5 FASTBSE NONE LIBXC SCALAPACK
     # Run exciting app tests
     - export OMP_NUM_THREADS=2 && python3 runtest.py -bp $PWD/../install/bin/ -e exciting_mpismp -repeat-tests 2

# Python frameworks on which exciting depends
# * excitingtools
# * Regression testing framework

python:excitingtools-python3:
  image: gitdocker.physik.hu-berlin.de/sol/exciting:fedora-GCC14-hdf5-fftw-scalapack-mpich
  stage: python
  tags:
    - docker
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[tutorial\]/'
      when: never
    - when: on_success
  before_script:
    - python3 -m pip install -U pip setuptools
    - python3 -m pip install --upgrade --force pylint coverage numpy contourpy matplotlib
  script:
    - cd tools/exciting_tools && python3 -m pip install -e .[dev,schemaparsing,h5_parsing,serialisation]
    # run ruff and check the files (includes some pylint, see also README.MD section Code 'Checking and Formatting')
    - ruff check
    - ruff format --diff
    # Run excitingtools unit tests and collect test coverage
    - coverage run -m pytest
    - coverage xml -o excitingtools_testcov.xml
    # go back to root
    - cd ../..
    # Run pylint on all modified python files
    - sh .gitlab/run_pylint.sh $CI_COMMIT_BRANCH
    # Run the schema parsing to detect changes
    - sh .gitlab/run_schema_parsing.sh
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: tools/exciting_tools/excitingtools_testcov.xml

# test pure excitingtools without extensions and for lowest supported python version
python:excitingtools-python3.10.pytest:
  image: python:3.10
  stage: python
  tags:
    - docker
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[tutorial\]/'
      when: never
    - when: on_success
  before_script:
    - python3 -m pip install --upgrade pip setuptools pytest
  script:
    - cd tools/exciting_tools && python3 -m pip install .
    - python3 -m pytest


python:regressionframework-python3:
  image: gitdocker.physik.hu-berlin.de/sol/exciting:fedora-GCC14-hdf5-fftw-scalapack-mpich
  stage: python
  tags:
    - docker
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[tutorial\]/'
      when: never
    - when: on_success
  before_script:
   # - apt-get --allow-releaseinfo-change update && apt-get install -y libpython3.7 libpython3.7-dev python3-pip
   # - python3.7 -m pip install --upgrade --force coverage
    - python3 -m pip install -U pip setuptools
    - python3 -m pip install coverage
    - python3 -m pip install h5py
    - python3 -m pip install pytest
    - python3 -m pip install pyyaml
    - python3 -m pip install termcolor
    - python3 -m pip install --upgrade numpy scipy
    - python3 -m pip install tools/exciting_tools
  script:
    - cd test/ && coverage run -m pytest test_functions/
    - coverage report > testframework_testcov.txt
  artifacts:
    paths:
      - test/testframework_testcov.txt

# Tokens and passwords should be stored as ENV VARs on Gitlab, not in readable form in the repo.
variables:
  PYPI_TOKEN: $excitingtools_pypi

deploy:excitingtools-pypi:
  image: gitdocker.physik.hu-berlin.de/sol/exciting:fedora-GCC14-hdf5-fftw-scalapack-mpich
  stage: deploy
  tags:
    - docker
  script:
    - cd tools/exciting_tools
    - >
      if [[ -n $(git diff HEAD^ HEAD -- pyproject.toml | grep '+version') ]]; then
        echo "excitingtools version has been bumped. Pushing to pypi"
        pip3 install -U pip build twine
        python3 -m build
        twine upload --skip-existing --non-interactive --username __token__ --password $PYPI_TOKEN dist/*
      else
        echo "pyproject.toml may have changed but the version number has not, so do not push to pypi"
      fi
  rules:
    # Only deploy when a feature is merged, not each time the pipeline passes
    - if: '$CI_COMMIT_REF_NAME == "development"'


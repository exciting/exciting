# LLVM Flang CI with and without GPU support on solPC06 runner

build:llvm-amdgpu-cpu:
  stage: build
  tags:
    - cpu:amd
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[tutorial\]/'
      when: never
    - when: on_success
  script:
    - module load amd-8248-drop-7.0.5
    - module load aocl-tools-amd-8248-drop-7.0.5
    - module load blis-amd-8248-drop-7.0.5
    - module load libflame-amd-8248-drop-7.0.5
    - module load fftw-amd-8248-drop-7.0.5
    - module load mpich-4.3.1-amd-8248-drop-7.0.5
    - mkdir build && cd build
    - cmake -DCMAKE_C_COMPILER=amdclang -DCMAKE_CXX_COMPILER=amdclang++ -DCMAKE_Fortran_COMPILER=amdflang -DAMDLINALG=ON ..
    - make -j 8 -l 8
    - make install
  artifacts:
    paths:
      - install/lib
      - install/bin/exciting_mpismp
      - src/version.inc
    expire_in: 24 hrs

build:llvm-amdgpu-cpu-nompi:
  stage: build
  tags:
    - gpu:amd
  script:
    - module load amd-8248-drop-7.0.5
    - module load aocl-tools-amd-8248-drop-7.0.5
    - module load blis-amd-8248-drop-7.0.5
    - module load libflame-amd-8248-drop-7.0.5
    - module load fftw-amd-8248-drop-7.0.5
    - module load mpich-4.3.1-amd-8248-drop-7.0.5
    - mkdir build && cd build
    - cmake -DCMAKE_C_COMPILER=amdclang -DCMAKE_CXX_COMPILER=amdclang++ -DCMAKE_Fortran_COMPILER=amdflang -DAMDLINALG=ON -DMPI=OFF ..
    - make -j 8 -l 8
    - make install
  artifacts:
    paths:
      - install/lib
      - install/bin/exciting_smp
      - src/version.inc
    expire_in: 24 hrs

test:llvm-amdgpu-cpu:
  stage: test
  tags:
   - cpu:amd
  dependencies:
    - build:llvm-amdgpu-cpu
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[tutorial\]/'
      when: never
    - when: on_success
  before_script:
    - source /etc/profile.d/modules.sh
    - python3 -m venv excitngenv
    - source excitngenv/bin/activate
    - python3 -m pip install -U pip setuptools
    - python3 -m pip install --upgrade --force pylint coverage numpy contourpy matplotlib pytest pyyaml termcolor
    - cd tools/exciting_tools
    # Install test framework parsers
    - python3 -m pip install -e .[dev,schemaparsing,h5_parsing,serialisation]
    - cd ../..
    - module load amd-8248-drop-7.0.5
    - module load aocl-tools-amd-8248-drop-7.0.5
    - module load blis-amd-8248-drop-7.0.5
    - module load libflame-amd-8248-drop-7.0.5
    - module load fftw-amd-8248-drop-7.0.5
    - module load mpich-4.3.1-amd-8248-drop-7.0.5
  script:
   # Run exciting unit tests
    - export OMP_NUM_THREADS=8 && install/bin/exciting_mpismp -run-unit-tests -kill-on-failure
   # Run exciting app tests
    - cd test/ && export OMP_NUM_THREADS=2 && python3 runtest.py -np 4 -omp 2 -bp $PWD/../install/bin/ -e exciting_mpismp -repeat-tests 2

build:llvm-amdgpu-gpu:
  stage: build
  tags:
    - gpu:amd
    - cpu:amd
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[tutorial\]/'
      when: never
    - when: on_success
  script:
    - module load rocm-6.4.1
    - module load amd-8248-drop-7.0.5
    - module load aocl-tools-amd-8248-drop-7.0.5
    - module load blis-amd-8248-drop-7.0.5
    - module load libflame-amd-8248-drop-7.0.5
    - module load fftw-amd-8248-drop-7.0.5
    - module load mpich-4.3.1-amd-8248-drop-7.0.5
    - export ROCAFAR=/home/soluser/progs/rocm-afar-8248-drop-7.0.5
    - module load magma-amd-8248
    - mkdir build && cd build
    - cmake -DCMAKE_C_COMPILER=${ROCAFAR}/bin/amdclang -DCMAKE_CXX_COMPILER=${ROCAFAR}/bin/amdclang++ -DCMAKE_Fortran_COMPILER=${ROCAFAR}/bin/amdflang -DAMDLINALG=ON -DAMD=ON -DAMDTARGET=gfx1102 -DMAGMA_ROOT=${MAGMA_ROOT} ..
    - make -j 8 -l 8
    - make install
  artifacts:
    paths:
      - install/lib
      - install/bin/exciting_mpismp
      - src/version.inc
    expire_in: 24 hrs

test:llvm-amdgpu-gpu:
  stage: test
  tags:
   - gpu:amd
   - cpu:amd
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[tutorial\]/'
      when: never
    - when: on_success
  resource_group: llvm-amdgpu-gpu-tests   # Ensures only ONE instance runs at a time per resource group (We are using both GPUs)
  dependencies:
    - build:llvm-amdgpu-gpu
  before_script:
    - source /etc/profile.d/modules.sh
    - python3 -m venv excitngenv
    - source excitngenv/bin/activate
    - python3 -m pip install -U pip setuptools
    - python3 -m pip install --upgrade --force pylint coverage numpy contourpy matplotlib pytest pyyaml termcolor
    - cd tools/exciting_tools
    - python3 -m pip install -e .[dev,schemaparsing,h5_parsing,serialisation]
    - cd ../..
    - module load rocm-6.4.1
    - module load amd-8248-drop-7.0.5
    - module load aocl-tools-amd-8248-drop-7.0.5
    - module load blis-amd-8248-drop-7.0.5
    - module load libflame-amd-8248-drop-7.0.5
    - module load fftw-amd-8248-drop-7.0.5
    - module load mpich-4.3.1-amd-8248-drop-7.0.5
    - export ROCAFAR=/home/soluser/progs/rocm-afar-8248-drop-7.0.5
    - module load magma-amd-8248
  script:
   # Run exciting unit tests
    - export OMP_NUM_THREADS=8 && install/bin/exciting_mpismp -run-unit-tests -kill-on-failure
   # Install test framework parsers
    - pip3 install -e tools/exciting_tools
   # Run exciting app tests
    - cd test/ && export OMP_OFFLOAD=MANDATORY && export OMP_NUM_THREADS=8 && python3 runtest.py -np 2 -omp 4 -bp $PWD/../install/bin/ -e exciting_mpismp -t GW/ZnO-PBESOL groundstate/PBE_SOL-Al


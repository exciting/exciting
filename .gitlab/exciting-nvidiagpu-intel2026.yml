# Compilation Intel using IFX compiler running on the
# nvidia:gpu runner

build:nvidiagpu-intel2026-serial:
  stage: build
  tags:
    - cpu:intel
    - gpu:nvidia
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[tutorial\]/'
      when: never
    - when: on_success
  before_script:
    - source /opt/intel/oneapi/setvars.sh
    - source /home/soluser/progs/spack-1.2.0/share/spack/setup-env.sh
    - spack load intel-oneapi-mpi@2021.17.2
  script:
    - mkdir build && cd build
    - FC=ifx CC=icx CXX=icpx ../external/cmake-3.31.3-linux-x86_64/bin/cmake -DMPI=OFF -DOMP=OFF -DMKL=ON ..
    - make -j 8 -l 8
    - make install
  artifacts:
    paths:
      - install/lib
      - install/bin/exciting_serial
      - src/version.inc
    expire_in: 24 hrs


test:nvidiagpu-intel2026-smp:
  stage: test
  tags:
    - cpu:intel
    - gpu:nvidia
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[tutorial\]/'
      when: never
    - when: on_success
  dependencies:
    - build:nvidiagpu-intel2026-smp
  before_script:
    - python3 -m venv excitngenv
    - source excitngenv/bin/activate
    - python3 -m pip install -U pip setuptools
    - python3 -m pip install --upgrade --force pylint coverage numpy contourpy matplotlib pytest pyyaml termcolor
    - cd tools/exciting_tools
    # Install test framework parsers
    - python3 -m pip install -e .[dev,schemaparsing,h5_parsing,serialisation]
    - cd ../..
    - source /opt/intel/oneapi/setvars.sh
    - source /home/soluser/progs/spack-1.2.0/share/spack/setup-env.sh
    - spack load intel-oneapi-mpi@2021.17.2
  script:
    # Run exciting unit tests
    - export OMP_NUM_THREADS=8 && install/bin/exciting_smp -run-unit-tests -kill-on-failure
    # Run exciting app tests
    - cd test/ && export OMP_NUM_THREADS=8 && python3 runtest.py -np 1 -omp 8 -bp $PWD/../install/bin/ -e exciting_smp -repeat-tests 2


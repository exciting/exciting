# Intel 2019 serial build and tests.
#
# The Intel modules are provided by HU's NFS server, rather than installed in 
# the base image (as it totals ~ 10 GB).
# The TCL module file is however, still provided by exciting.
#
# Note, exciting is compiled in serial, but it links to threaded MKL
# To change this, one can replace the make.inc line with:
# - cp build/platforms/make.inc.ifort.serial build/make.inc
#
# The line `- python3 -m pip install --upgrade --force pip pillow==7.0.0 numpy termcolor pytest pyyaml`
# is required because the docker base used for intel does not include python
# and the corresponding packages. Consider building a new `exciting:debian-base-with-nfs` image

build:debian-buster-Intel2021-serial:
   image: gitdocker.physik.hu-berlin.de/sol/exciting:debian-base-with-nfs
   stage: build
   tags:
     - docker
   rules:
     - if: '$CI_COMMIT_MESSAGE =~ /\[tutorial\]/'
       when: never
     - when: on_success
   before_script:
     # Module file, with paths consistent with the nfs drive
     - cp -r utilities/build/modules/intel /etc/environment-modules/modules
     - eval "`/usr/lib/x86_64-linux-gnu/modulecmd.tcl sh autoinit`"
     - module load intel/oneapi-2021.3
   script:
     - mkdir build-cmake && cd build-cmake
     - FC=ifort CC=icc CXX=icpc ../external/cmake-3.31.3-linux-x86_64/bin/cmake -DMPI=OFF -DOMP=OFF -DMKL=ON ..
     - make -j 4 -l 4
     - make install
   artifacts:
     paths:
       - install/lib
       - install/bin/exciting_serial
       - src/version.inc
     expire_in: 12 hrs

test-debian-buster-Intel2021-serial:
   image: gitdocker.physik.hu-berlin.de/sol/exciting:debian-base-with-nfs
   stage: test
   rules:
     - if: '$CI_COMMIT_MESSAGE =~ /\[tutorial\]/'
       when: never
     - when: on_success
   dependencies:
     - build:debian-buster-Intel2021-serial
     - python:regressionframework-python3
   tags:
     - docker
   before_script:
     - cp -r utilities/build/modules/intel /etc/environment-modules/modules
     - eval "`/usr/lib/x86_64-linux-gnu/modulecmd.tcl sh autoinit`"
     - module load intel/oneapi-2021.3
     - python3 -m pip install --upgrade --force pip pillow==7.0.0 numpy termcolor pytest pyyaml
   script:
    # Run exciting unit tests
     - install/bin/exciting_serial -run-unit-tests -kill-on-failure
    # Install test framework parsers
     - python3 -m pip install -e tools/exciting_tools
    # Run exciting app tests
     - cd test/ && python3 runtest.py -bp $PWD/../install/bin/ -e exciting_serial -repeat-tests 2

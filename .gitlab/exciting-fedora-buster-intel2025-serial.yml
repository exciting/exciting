# Intel 2025 serial build and tests.

build:fedora-buster-Intel2025-serial:
   image: gitdocker.physik.hu-berlin.de/sol/exciting:fedora_inteloneapi2025
   stage: build
   tags:
     - docker
   before_script:
     - source /opt/intel/oneapi/setvars.sh
   script:
     - mkdir build-cmake && cd build-cmake
     - FC=ifx CC=icx CXX=icpx ../external/cmake-3.31.3-linux-x86_64/bin/cmake -DMPI=OFF -DOMP=OFF -DMKL=ON ..
     - make -j 4 -l 4
     - make install
   artifacts:
     paths:
       - install/lib
       - install/bin/exciting_serial
       - src/version.inc
     expire_in: 5 hrs

test-fedora-buster-Intel2025-serial:
   image: gitdocker.physik.hu-berlin.de/sol/exciting:fedora_inteloneapi2025
   stage: test
   dependencies:
     - build:fedora-buster-Intel2025-serial
     - python:regressionframework-python3
   tags:
     - docker
   before_script:
     - source /opt/intel/oneapi/setvars.sh
     - pip3 install numpy termcolor pytest pyyaml
   script:
    # Run exciting unit tests
     - install/bin/exciting_serial -run-unit-tests -kill-on-failure
    # Install test framework parsers
     - pip3 install -e tools/exciting_tools
    # Run exciting app tests
     - cd test/ && python3 runtest.py -r $PWD/../install/bin/ -e exciting_serial -repeat-tests 2

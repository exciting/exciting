# Test the Jupyter tutorials

include:
  - local: '/.gitlab/python-libs.yml'

test-fedora-buster-gnu-smp-jupyter:
 image: gitdocker.physik.hu-berlin.de/sol/exciting:fedora-GCC14-hdf5-fftw-scalapack-mpich

 stage: test
 dependencies:
  - build:fedora-buster-gnu-smp
  - python:excitingtools-python3
 tags:
  - docker
 timeout: 24h  # Increased timeout from default 3h to 24h
 # One might consider moving construction of venv to the build state and make it an artifact
 # Several tutorials are commented out, as they take a very long time to be executed in the CI (~10h each).
 # One should investigate if the execution can be sped up.
 script:
  - cd tools/excitingjupyter
  - source set_env_vars.sh
  - source create_env.sh
  - pip3 install pytest
  - python3 -m pip install -U pip setuptools
  - python3 -m pip install --upgrade --force pylint coverage numpy contourpy matplotlib scipy
  - python3 -m pytest -vv ../excitingscripts/tests
  - cd excitingjupyter
  - time jupyter nbconvert --execute 01_getting_started/how_to_start_an_exciting_calculation.ipynb --to markdown
  - time python3 01_getting_started/assertions/how_to_start_an_exciting_calculation.py
 # - time jupyter nbconvert --execute 01_getting_started/simple_convergence_tests.ipynb --to markdown
 # - time python3 01_getting_started/assertions/simple_convergence_tests.py
  - time jupyter nbconvert --execute 01_getting_started/electronic_band_structure_and_density_of_states.ipynb --to markdown
  - time python3 01_getting_started/assertions/electronic_band_structure_and_density_of_states.py
  - time jupyter nbconvert --execute 01_getting_started/understanding_the_exciting_species_files.ipynb --to markdown
  - time jupyter nbconvert --execute 02_ground_state/01_Methods/exchange_correlation_functionals.ipynb --to markdown
  - time python3 02_ground_state/01_Methods/assertions/exchange_correlation_functionals.py
  - time jupyter nbconvert --execute 02_ground_state/01_Methods/how_to_visualize_kohn_sham_states.ipynb --to markdown

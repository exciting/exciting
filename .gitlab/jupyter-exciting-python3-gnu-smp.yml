 # - time jupyter nbconvert --execute 02_ground_state/01_Methods/hybrid_functional_calculations.ipynb --to markdown
 # - time python3 02_ground_state/01_Methods/assertions/hybrid_functional_calculations.py
  - time jupyter nbconvert --execute 02_ground_state/01_Methods/spin_orbit_coupling.ipynb --to markdown
 # - time python3 02_ground_state/01_Methods/assertions/spin_orbit_coupling.py
  - time jupyter nbconvert --execute 02_ground_state/01_Methods/spin_polarized_calculations_for_bcc_Fe.ipynb --to markdown
 # - time python3 02_ground_state/01_Methods/assertions/spin_polarized_calculations_for_bcc_Fe.py

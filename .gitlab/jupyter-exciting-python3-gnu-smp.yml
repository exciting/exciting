# Test the Jupyter tutorials

include:
  - local: '/.gitlab/python-libs.yml'

test-fedora-buster-gnu-smp-jupyter:
 image: gitdocker.physik.hu-berlin.de/sol/exciting:fedora-GCC14-hdf5-fftw-scalapack-mpich

 stage: test
 dependencies:
  - build:fedora-buster-gnu-smp
  - python:excitingtools-python3
 tags:
  - docker
 timeout: 24h  # Increased timeout from default 3h to 24h
 # One might consider moving construction of venv to the build state and make it an artifact
 script:
  - cd tools/excitingjupyter
  - source set_env_vars.sh
  - source create_env.sh
  - pip3 install pytest
  - python3 -m pip install -U pip setuptools
  - python3 -m pip install --upgrade --force pylint coverage numpy contourpy matplotlib scipy
  - python3 -m pytest -vv ../excitingscripts/tests
  - cd excitingjupyter
  - time jupyter nbconvert --execute 01_getting_started/01_tutorial_how_to_start_an_exciting_calculation.ipynb --to markdown
  - time python3 01_getting_started/assertions_how_to_start_an_exciting_calculation.py
  - time jupyter nbconvert --execute 01_getting_started/02_tutorial_simple_convergence_tests.ipynb --to markdown 
  - time jupyter nbconvert --execute 01_getting_started/03_tutorial_electronic_band_structure_and_density_of_states.ipynb --to markdown
  - time jupyter nbconvert --execute 01_getting_started/04_tutorial_understanding_the_exciting_species_files.ipynb --to markdown 
  - time jupyter nbconvert --execute 02_ground_state/01_Methods/01_tutorial_exchange_correlation_functionals.ipynb --to markdown
  - time jupyter nbconvert --execute 02_ground_state/01_Methods/02_how_to_visualize_kohn_sham_states.ipynb --to markdown
  - time jupyter nbconvert --execute 02_ground_state/01_Methods/05_tutorial_hybrid_functional_calculations.ipynb --to markdown
  - time jupyter nbconvert --execute 02_ground_state/01_Methods/04_tutorial_spin_orbit_coupling.ipynb --to markdown
  - time jupyter nbconvert --execute 02_ground_state/01_Methods/03_tutorial_spin_polarized_calculations_for_bcc_Fe.ipynb --to markdown
  - time jupyter nbconvert --execute 02_ground_state/02_Electronic_Properties/02_tutorial_fermi_surface_visualization.ipynb --to markdown
  - time jupyter nbconvert --execute 02_ground_state/02_Electronic_Properties/03_tutorial_spin_texture_calculation.ipynb --to markdown
  - time jupyter nbconvert --execute 02_ground_state/tutorial_excitingtools.ipynb --to markdown
  - time jupyter nbconvert --execute 03_excited_states/01_GW/01_tutorial_electronic_band_structure_from_gw.ipynb --to markdown
  - time python3 03_excited_states/01_GW/assertions_01_tutorial_electronic_band_structure_from_gw.py
  - time jupyter nbconvert --execute 03_excited_states/02_BSE/01_tutorial_excited_states_from_bse.ipynb --to markdown
  - time jupyter nbconvert --execute 03_excited_states/02_BSE/02_tutorial_exciton_analysis_and_visualization.ipynb --to markdown
  - time jupyter nbconvert --execute 03_excited_states/02_BSE/03_tutorial_xray_absorption_spectra_using_bse.ipynb --to markdown
  - time python3 03_excited_states/02_BSE/assertions_03_tutorial_xray_absorption_spectra_using_bse.py
  - time jupyter nbconvert --execute 03_excited_states/02_BSE/04_tutorial_xray_emission_spectra.ipynb --to markdown
  - time python3 03_excited_states/02_BSE/assertions_04_tutorial_xray_emission_spectra.py
  - time jupyter nbconvert --execute 03_excited_states/02_BSE/05_tutorial_q_dependent_bse_calculations.ipynb --to markdown
  - time python3 03_excited_states/02_BSE/assertions_05_tutorial_q_dependent_bse_calculations.py
  - time jupyter nbconvert --execute 03_excited_states/03_TDDFT/01_tutorial_excited_states_from_tddft.ipynb --to markdown
  - time python3 03_excited_states/03_TDDFT/assertions_01_tutorial_excited_states_from_tddft.py
  - time jupyter nbconvert --execute 03_excited_states/03_TDDFT/02_tutorial_real_time_tddft.ipynb --to markdown
  - time jupyter nbconvert --execute 03_excited_states/03_TDDFT/03_tutorial_q_dependent_tddft.ipynb --to markdown
  - time jupyter nbconvert --execute 03_excited_states/03_TDDFT/04_tutorial_many_body_kernels_for_tddft_calculations.ipynb --to markdown
  - time jupyter nbconvert --execute 03_excited_states/03_TDDFT/05_tutorial_simulating_pump_probe_spectroscopy_with_rt_tddft.ipynb --to markdown
  - time jupyter nbconvert --execute 03_excited_states/03_TDDFT/06_tutorial_studying_higher_harmonics_generation_using_rt_tddft.ipynb --to markdown
  - time jupyter nbconvert --execute 03_excited_states/03_TDDFT/07_tutorial_real_time_tddft_combined_with_molecular_dynamics.ipynb --to markdown
 rules:
    - if: '$CI_COMMIT_BRANCH == "development"'

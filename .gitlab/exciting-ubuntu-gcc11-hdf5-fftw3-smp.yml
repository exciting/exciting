# GCC11 MPI+SMP build and tests.
# Consult `build/utilities/docker/` to find the base Dockerfile

build:ubuntu-GCC11-hdf5-fftw3-smp:
 image: gitdocker.physik.hu-berlin.de/sol/exciting:ubuntu-GCC11-hdf5-December2023
 stage: build

 # Do not run when excitingtools is updated
 #only:
 #  changes:
 #    - "src/*"
 #    - "build/*"
 #
 #except:
 #  changes:
 #    - "tools/exciting_tools/*"

 tags:
   - docker
 script:
   - cp build/platforms/make.inc.gfortran10+.hdf5.fftw3 build/make.inc
   - make smp -j 2
 artifacts:
   paths:
     - bin/exciting_smp
     - build/make.inc
   expire_in: 5 hrs

test-ubuntu-GCC11-hdf5-fftw3-smp:
  image: gitdocker.physik.hu-berlin.de/sol/exciting:ubuntu-GCC11-hdf5-December2023
  stage: test
  except: 
   changes:
     - "tools/exciting_tools/*"
  dependencies:
    - build:ubuntu-GCC11-hdf5-fftw3-smp
    - python:excitingtools-python-3.7
    - python:regressionframework-python-3.7
  tags:
    - docker
  script:
    # Run exciting unit tests
    - export OMP_NUM_THREADS=2 && bin/exciting_smp -run-unit-tests -kill-on-failure
    # Install test framework parsers
    - python3 -m pip install --upgrade pip setuptools
    - python3 -m pip install h5py
    - python3 -m pip install tools/exciting_tools
    # Run exciting app tests
    # Set GROUPs to run 
    - cd test
    # In this case, ONLY run tests with GROUPS tag: HDF5 FASTBSE
    - python3 set_groups.py -file defaults_config.yml -groups HDF5 FASTBSE 
    # Run exciting linked to hdf5 and fftw3 application tests
    - python3 runtest.py -e exciting_smp
